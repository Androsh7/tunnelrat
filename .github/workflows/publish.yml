# Build the package at a given ref and publish it to PyPI via trusted publishing.
#
# This workflow has no trigger of its own. It is called by tag.yml once a new
# release tag has been created, and can be run manually to re-publish a tag
# whose earlier attempt failed.

name: Publish to PyPI

on:
  workflow_call:
    inputs:
      ref:
        description: Tag (or other ref) to build and publish
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Tag (or other ref) to build and publish, e.g. v1.4.2
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build package
        run: python -m build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
